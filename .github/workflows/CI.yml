name: CI
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The 1.13 entry is a pre-release readiness check, not a gate: an RC can change under us, so a
    # red run there must not block a PR. Remove `continue-on-error` once 1.13.0 final ships.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12"]
        os: [ubuntu-latest, macOS-latest, windows-latest]
        include:
          # `"1.13"` would NOT match a pre-release (setup-julia excludes them from plain ranges);
          # `~1.13.0-rc1` matches the current rc and every later 1.13, including the eventual final.
          - version: "~1.13.0-rc1"
            os: ubuntu-latest
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # `Pkg.test()`, NOT `runtests.jl` directly: it builds the proper test environment and forces
      # `--check-bounds=yes`, which changes codegen. Running the file directly leaves bounds checking
      # at `auto` and silently skips that whole configuration — it is how five vectorization-shape
      # failures stayed invisible here. checks_enabled defaults to true, so the failing-path items
      # actually exercise the guarantees, and StrictModeTest refuses to load if that is not so.
      - run: julia --project=StrictMode -e 'import Pkg; Pkg.test(; coverage = true)'
        env:
          JULIA_NUM_THREADS: 2
      # The split's premise, and the ONLY place it can be checked: StrictMode with no
      # proofs installed. Every item in test/ runs with StrictModeTest loaded, so none of them can
      # catch a guarantee that has re-acquired a hard AllocCheck/JET/TrimCheck dependency — which
      # would break StrictMode as a plain [deps] entry in a consumer's Project.toml.
      - name: StrictMode standalone — instantiate
        run: julia --project=StrictMode/test/standalone -e 'import Pkg; Pkg.instantiate()'
      # `JULIA_LOAD_PATH` is a step env rather than a shell prefix: Windows runs `run:` under
      # PowerShell, which has no `VAR=value command` form. Its separator is platform-specific too —
      # `;` on Windows, `:` everywhere else — so the value is chosen per runner, not hardcoded.
      - name: StrictMode standalone (no proofs installed)
        env:
          JULIA_LOAD_PATH: ${{ runner.os == 'Windows' && '@;@stdlib' || '@:@stdlib' }}
        run: julia --project=StrictMode/test/standalone StrictMode/test/standalone/runtests.jl
      # StrictModeTest's own suite: the proof primitives (allocation classification, ignore_throw,
      # the JET and TrimCheck drivers) and the @test_* / test_* gating surface. StrictMode cannot test
      # these: it does not depend on AllocCheck, JET, or TrimCheck at all.
      - name: StrictModeTest suite
        run: julia --project=StrictModeTest -e 'import Pkg; Pkg.test()'
      # The consumer layout, end to end: StrictMode in a package's own Project.toml with
      # @strict_function in its src/, StrictModeTest only in its test/. Needs a real precompile of a
      # second package, so it is its own step rather than part of the main suite. It is the only
      # place the arrangement the split exists to serve is actually exercised.
      - name: Consumer layout (src/ annotations + test/ proofs)
        run: |
          julia --project=StrictMode/test/consumer/ConsumerPkg -e 'import Pkg; Pkg.instantiate(); Pkg.precompile()'
          cd StrictMode/test/consumer/ConsumerPkg && julia --project=. -e 'import Pkg; Pkg.test()'
      # Collect & upload coverage from the release Linux job only (avoids duplicate uploads, the
      # pre-release job, and Windows path quirks).
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
        with:
          directories: StrictMode/src,StrictMode/ext
      - name: Upload coverage to Coveralls
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov
          fail-on-error: false
