name: CI
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The 1.13 entry is a pre-release readiness check, not a gate: an RC can change under us, so a
    # red run there must not block a PR. Remove `continue-on-error` once 1.13.0 final ships.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12"]
        os: [ubuntu-latest, macOS-latest, windows-latest]
        include:
          # `"1.13"` would NOT match a pre-release (setup-julia excludes them from plain ranges);
          # `~1.13.0-rc1` matches the current rc and every later 1.13, including the eventual final.
          - version: "~1.13.0-rc1"
            os: ubuntu-latest
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # `Pkg.test()`, NOT `runtests.jl` directly: it builds the proper test environment and forces
      # `--check-bounds=yes`, which changes codegen. Running the file directly leaves bounds checking
      # at `auto` and silently skips that whole configuration — it is how five vectorization-shape
      # failures stayed invisible here. test/Project.toml sets [preferences.StrictMode]
      # checks_enabled=true, so the failing-path items actually exercise the guarantees.
      - run: julia --project=. -e 'import Pkg; Pkg.test(; coverage = true)'
        env:
          JULIA_NUM_THREADS: 2
      # The split's premise, and the ONLY place it can be checked: StrictMode with no analysis
      # backend installed. Every item in test/ runs with StrictModeTest loaded, so none of them can
      # catch a guarantee that has re-acquired a hard AllocCheck/JET/TrimCheck dependency — which
      # would break StrictMode as a plain [deps] entry in a consumer's Project.toml.
      - name: StrictMode standalone (no analysis backend)
        run: |
          julia --project=test/standalone -e 'import Pkg; Pkg.instantiate()'
          julia --project=test/standalone test/standalone/runtests.jl
      # StrictModeTest's own suite: the `_be_*` seam implementations (allocation classification,
      # ignore_throw, the JET and TrimCheck drivers). StrictMode cannot test these — over there the
      # seam is a set of undefined stub functions.
      - name: StrictModeTest suite
        run: julia --project=StrictModeTest -e 'import Pkg; Pkg.test()'
      # Collect & upload coverage from the release Linux job only (avoids duplicate uploads, the
      # pre-release job, and Windows path quirks).
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
      - name: Upload coverage to Coveralls
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.12'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov
          fail-on-error: false
