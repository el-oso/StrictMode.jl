name: Documenter

on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Allow the GITHUB_TOKEN to push the built site to the gh-pages branch.
permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v3
      # DocumenterVitepress needs Node to build the static site.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The action's v1 install step is one command, `Pkg.develop(PackageSpec(path=pwd()));
      # Pkg.instantiate()`, behind a single `install-package` flag. The develop half cannot work now
      # that the repository root is not a package, and turning the flag off takes instantiate with
      # it, so the docs environment is prepared here instead. `docs/Project.toml` carries
      # `[sources] StrictMode = {path = "../StrictMode"}`, which is what makes develop unnecessary.
      - name: Instantiate the docs environment
        run: julia --project=docs -e 'import Pkg; Pkg.instantiate()'
      - name: Build and deploy docs
        uses: julia-actions/julia-docdeploy@v1
        with:
          install-package: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: "Documenter"
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
